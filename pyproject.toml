[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-crowding-monitor"
version = "0.1.0"
description = "Research framework for monitoring crowding and overheating risk in U.S. equity ETFs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "streamlit>=1.33",
    "yfinance==1.5.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"etf_crowding.resources" = ["*.yaml"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true

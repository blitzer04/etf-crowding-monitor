name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check dependency integrity
        run: python -m pip check

      - name: Lint
        run: python -m ruff check --no-cache .

      - name: Check formatting
        run: python -m ruff format --check --no-cache .

      - name: Type check
        run: python -m mypy --no-incremental --cache-dir "${{ runner.temp }}/mypy" src/etf_crowding app

      - name: Test offline suite
        run: python -m pytest -W error -q -p no:cacheprovider --basetemp "${{ runner.temp }}/pytest"
